name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Linux webview build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Run the Bash quality gate
        run: bash scripts/test.sh

  desktop-linux:
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Linux webview build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build the Linux desktop packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          printf '%s\n' "$version" > VERSION
          bash scripts/build-desktop.sh --skip-tests
      - uses: actions/upload-artifact@v7
        with:
          name: release-desktop-linux-${{ matrix.arch }}
          path: |
            build/bin/*.deb
            build/bin/*.rpm
            build/bin/*.AppImage

  desktop-windows:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build and archive the Windows desktop application (amd64 + arm64)
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Set-Content -Path VERSION -Value $version -Encoding ascii
          ./scripts/build-desktop.ps1 -SkipTests
          foreach ($arch in @('amd64', 'arm64')) {
            Compress-Archive -Path "build/bin/playlist-forge-$arch.exe" `
              -DestinationPath "playlist-forge-desktop-windows-$arch.zip"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: release-desktop-windows
          path: playlist-forge-desktop-windows-*.zip

  desktop-macos:
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build and archive the universal macOS desktop application
        run: |
          version="${GITHUB_REF_NAME#v}"
          printf '%s\n' "$version" > VERSION
          bash scripts/build-desktop.sh --skip-tests
          ditto -c -k --sequesterRsrc --keepParent build/bin/playlist-forge.app playlist-forge-desktop-macos-universal.zip
      - uses: actions/upload-artifact@v7
        with:
          name: release-desktop-macos
          path: playlist-forge-desktop-macos-universal.zip

  publish:
    needs: [quality, desktop-linux, desktop-windows, desktop-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download desktop release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-desktop-*
          path: release
          merge-multiple: true
      - name: Write release checksums
        shell: bash
        run: |
          cd release
          sha256sum playlist-forge-* > SHA256SUMS.txt
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --generate-notes \
              --title "Playlist Forge $GITHUB_REF_NAME"
          fi
