name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run the Bash quality gate
        run: bash scripts/test.sh

  desktop-linux:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Linux webview build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build the Linux desktop packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i -E 's/"productVersion": "[^"]+"/"productVersion": "'"$version"'"/' wails.json
          bash scripts/build-desktop.sh --skip-tests
      - uses: actions/upload-artifact@v7
        with:
          name: release-desktop-linux
          path: |
            build/bin/*.deb
            build/bin/*.rpm
            build/bin/*.AppImage

  desktop-windows:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Build and archive the Windows desktop application
        shell: pwsh
        run: |
          $config = Get-Content wails.json -Raw | ConvertFrom-Json
          $config.info.productVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $config | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8
          ./scripts/build-desktop.ps1 -SkipTests
          Compress-Archive -Path build/bin/* -DestinationPath playlist-forge-desktop-windows-amd64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: release-desktop-windows
          path: playlist-forge-desktop-windows-amd64.zip

  desktop-macos:
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build and archive the universal macOS desktop application
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i '' -E 's/"productVersion": "[^"]+"/"productVersion": "'"$version"'"/' wails.json
          bash scripts/build-desktop.sh --skip-tests
          ditto -c -k --sequesterRsrc --keepParent build/bin/playlist-forge.app playlist-forge-desktop-macos-universal.zip
      - uses: actions/upload-artifact@v7
        with:
          name: release-desktop-macos
          path: playlist-forge-desktop-macos-universal.zip

  publish:
    needs: [quality, desktop-linux, desktop-windows, desktop-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build all release binaries
        run: bash scripts/build.sh --skip-tests --output release
      - name: Download desktop release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-desktop-*
          path: release
          merge-multiple: true

      - name: Resolve the lowercase GHCR image name
        id: image
        uses: actions/github-script@v8
        with:
          result-encoding: string
          script: return 'ghcr.io/${{ github.repository }}'.toLowerCase()
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Generate release image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.result }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and publish the multi-platform image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Attest the published image
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.result }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate the release SBOM from the published image
        uses: anchore/sbom-action@v0
        env:
          SYFT_PLATFORM: linux/amd64
        with:
          image: ${{ steps.image.outputs.result }}@${{ steps.push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: release/playlist-forge-container-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Include the SBOM in release checksums
        shell: bash
        run: |
          cd release
          sha256sum playlist-forge-* > SHA256SUMS.txt
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --generate-notes \
              --title "Playlist Forge $GITHUB_REF_NAME"
          fi
