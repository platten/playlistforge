<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="author" content="Paul Pietkiewicz" />
    <meta name="license" content="MIT" />
    <meta
      name="description"
      content="Build beautifully grounded playlists with OpenAI and Soundiiz."
    />
    <title>Playlist Forge</title>
    <script>
      // Resolve the theme before first paint so the interface never flashes
      // the wrong palette. Mirrors readTheme() in App.tsx.
      (function () {
        try {
          var stored = localStorage.getItem("pf-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
